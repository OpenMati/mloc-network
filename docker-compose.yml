version: "3.9"

services:
  redis:
    image: redis:7.4-alpine
    container_name: mloc-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
      --appendonly yes
      --appendfsync everysec
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
      --save 900 1
      --save 300 10
      --save 60 10000
      --stop-writes-on-bgsave-error no
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  orchestrator:
    image: ghcr.io/astral-sh/uv:0.4.19-python3.12
    container_name: mloc-orchestrator
    working_dir: /workspace
    command: >
      sh -c "uv sync --extra inference && uv run python orchestrator/main.py"
    environment:
      - PYTHONPATH=/workspace
      - PORT=${ORCHESTRATOR_PORT:-8000}
    env_file:
      - .env
    volumes:
      - .:/workspace
      - ./data/orchestrator/results:${ORCHESTRATOR_RESULTS_DIR:-/data/orchestrator/results}
      - ./data/orchestrator/state:${ORCHESTRATOR_STATE_DIR:-/data/orchestrator/state}
    ports:
      - "${ORCHESTRATOR_PORT:-8000}:8000"
    depends_on:
      - redis

  worker:
    image: ghcr.io/astral-sh/uv:0.4.19-python3.12
    container_name: mloc-worker
    working_dir: /workspace
    command: >
      sh -c "uv sync --extra inference && uv run python worker/main.py"
    environment:
      - PYTHONPATH=/workspace
    env_file:
      - .env
    volumes:
      - .:/workspace
      - ./data/worker/results:${RESULTS_DIR:-/data/worker/results}
    depends_on:
      - redis
      - orchestrator

volumes:
  redis_data:
    driver: local
