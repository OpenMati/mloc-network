# Docker Compose Configuration Example - WebSocket and Redis Hybrid Deployment
# 
# This example demonstrates how to deploy workers using both WebSocket and Redis

version: '3.8'

services:
  # Redis service (for worker registration and state management)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Orchestrator service
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: "redis://redis:6379/0"
      RESULTS_DIR: "/results"
      LOG_LEVEL: "INFO"
      # Optional: Enable authentication
      # ORCHESTRATOR_TOKEN: "your-secret-token"
    volumes:
      - ./results_host:/results
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  # WebSocket Worker 1 - using WebSocket long connection
  worker-websocket-1:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      # WebSocket configuration
      WORKER_USE_WEBSOCKET: "true"
      ORCHESTRATOR_BASE_URL: "http://orchestrator:8000"
      
      # Worker configuration
      WORKER_ID: "worker-ws-001"
      REDIS_URL: "redis://redis:6379/0"
      WORKER_COST_PER_HOUR: "3.5"
      WORKER_TAGS: "gpu,inference,websocket"
      
      # Other configurations
      TASK_TOPIC: "tasks"
      RESULTS_DIR: "/results"
      HEARTBEAT_INTERVAL_SEC: "30"
      LOG_LEVEL: "INFO"
    volumes:
      - ./results_workers:/results
    depends_on:
      orchestrator:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # WebSocket Worker 2 - another worker using WebSocket
  worker-websocket-2:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      WORKER_USE_WEBSOCKET: "true"
      ORCHESTRATOR_BASE_URL: "http://orchestrator:8000"
      WORKER_ID: "worker-ws-002"
      REDIS_URL: "redis://redis:6379/0"
      WORKER_COST_PER_HOUR: "3.5"
      WORKER_TAGS: "gpu,inference,websocket"
      RESULTS_DIR: "/results"
      LOG_LEVEL: "INFO"
    volumes:
      - ./results_workers:/results
    depends_on:
      orchestrator:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Redis Worker - using traditional Redis Pub/Sub
  worker-redis-1:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      # Do not enable WebSocket
      WORKER_USE_WEBSOCKET: "false"
      
      # Worker configuration
      WORKER_ID: "worker-redis-001"
      REDIS_URL: "redis://redis:6379/0"
      WORKER_COST_PER_HOUR: "2.5"
      WORKER_TAGS: "cpu,training"
      
      # Other configurations
      TASK_TOPIC: "tasks"
      RESULTS_DIR: "/results"
      HEARTBEAT_INTERVAL_SEC: "30"
      LOG_LEVEL: "INFO"
    volumes:
      - ./results_workers:/results
    depends_on:
      redis:
        condition: service_healthy

  # Redis Worker 2 - another worker using Redis
  worker-redis-2:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      WORKER_USE_WEBSOCKET: "false"
      WORKER_ID: "worker-redis-002"
      REDIS_URL: "redis://redis:6379/0"
      WORKER_COST_PER_HOUR: "2.0"
      WORKER_TAGS: "cpu,inference"
      RESULTS_DIR: "/results"
      LOG_LEVEL: "INFO"
    volumes:
      - ./results_workers:/results
    depends_on:
      redis:
        condition: service_healthy

volumes:
  results_host:
  results_workers:

# ============================================
# Usage Instructions
# ============================================
# 
# 1. Start all services (hybrid mode):
#    docker-compose -f docker-compose.websocket.yml up -d
# 
# 2. Start only WebSocket workers:
#    docker-compose -f docker-compose.websocket.yml up -d orchestrator redis worker-websocket-1 worker-websocket-2
# 
# 3. Start only Redis workers:
#    docker-compose -f docker-compose.websocket.yml up -d orchestrator redis worker-redis-1 worker-redis-2
# 
# 4. View logs:
#    docker-compose -f docker-compose.websocket.yml logs -f worker-websocket-1
# 
# 5. Check WebSocket connection status:
#    curl http://localhost:8000/ws/stats
# 
# 6. View all workers:
#    curl http://localhost:8000/workers
# 
# 7. Stop all services:
#    docker-compose -f docker-compose.websocket.yml down
# 
# 8. Scale WebSocket workers:
#    docker-compose -f docker-compose.websocket.yml up -d --scale worker-websocket-1=3
#
